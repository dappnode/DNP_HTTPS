name: "Main"
on:
  pull_request:
  push:
    branches:
      - "master"
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "README.md"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - run: yarn lint
      - run: yarn lint:ejs
      - run: yarn test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [unit-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Publish
        run: npx --yes @dappnode/dappnodesdk@0.3.55 publish patch --dappnode_team_preset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPER_ADDRESS: "0xf35960302a07022aba880dffaec2fdd64d5bf1c1"
